name: macOS checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-26, xcode-27]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
      - run: bash scripts/build-app.sh
      - run: python3 scripts/check-localization.py
